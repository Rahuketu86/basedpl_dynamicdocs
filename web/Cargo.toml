[package]
name = "basedpl-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
basedpl = { path = "../build/basedpl" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.27.0", features = ["js"] }
