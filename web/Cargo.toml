[package]
name = "basedpl-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
basedpl = { git = "https://github.com/AnswerDotAI/basedpl.git", rev = "44352d9b63ef7532055f373c6cc32984430f71f5" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.27.0", features = ["js"] }
