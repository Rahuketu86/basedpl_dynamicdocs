name: Deploy BasedPL APL Reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129
      - name: Prepare patched BasedPL
        run: ./scripts/prepare_basedpl_wasm.sh
      - name: Build BasedPL WASM
        run: |
          rm -rf build/bpl
          cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml
          echo 'Built WASM files:'
          find . -type f -path '*/wasm32-unknown-unknown/release/*.wasm' -print
          WASM=$(find . -type f -path '*/wasm32-unknown-unknown/release/basedpl_web.wasm' -print -quit)
          if [ -z "$WASM" ]; then
            echo 'ERROR: basedpl_web.wasm was not found'
            exit 1
          fi
          wasm-bindgen "$WASM" --target web --out-dir build/bpl
          rm -rf build/diagnostic
          wasm-bindgen "$WASM" --target nodejs --out-dir build/diagnostic
          node - <<'NODE'
          const { BplSession } = require('./build/diagnostic/basedpl_web.js');
          const s = new BplSession();
          for (const code of ['12+4', '+/ 12 4 3']) {
            console.log('DIAGNOSTIC', JSON.stringify(code), s.diagnostic(code));
          }
          NODE
      - name: Build site
        run: python build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
