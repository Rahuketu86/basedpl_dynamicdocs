name: Deploy BasedPL APL Reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This cache is deliberately independent of JupyterLite/frontend changes.
      # Bump BPL_WASM_CACHE_VERSION only when the Rust/WASM implementation changes.
      - name: Restore BasedPL WASM cache
        id: bpl-wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/bpl
          key: basedpl-wasm-v1

      - name: Install Rust
        if: steps.bpl-wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        if: steps.bpl-wasm-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129
      - name: Prepare patched BasedPL
        if: steps.bpl-wasm-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare_basedpl_wasm.sh
      - name: Build BasedPL WASM
        if: steps.bpl-wasm-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf build/bpl
          cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml
          echo 'Built WASM files:'
          find . -type f -path '*/wasm32-unknown-unknown/release/*.wasm' -print
          WASM=$(find . -type f -path '*/wasm32-unknown-unknown/release/basedpl_web.wasm' -print -quit)
          if [ -z "$WASM" ]; then
            echo 'ERROR: basedpl_web.wasm was not found'
            exit 1
          fi
          wasm-bindgen "$WASM" --target web --out-dir build/bpl
          rm -rf build/diagnostic
          wasm-bindgen "$WASM" --target nodejs --out-dir build/diagnostic
          node - <<'NODE'
          const { BplSession } = require('./build/diagnostic/basedpl_web.js');
          const s = new BplSession();
          for (const [code, expected] of [['12+4', '16'], ['⍳5', '0 1 2 3 4'], ['+/ 1 2 3', '6']]) {
            const result = JSON.parse(s.eval(code));
            console.log('EVAL', JSON.stringify(code), JSON.stringify(result));
            if (result.error) process.exit(1);
            const display = (result.events || [])
              .filter(e => e.kind === 'display')
              .map(e => e.data?.['text/plain'] || '')
              .join('');
            if (!display.includes(expected)) {
              console.error('Missing display event:', expected, display);
              process.exit(1);
            }
          }

          // Persistent-session regression: the notebook kernel must retain
          // definitions between execute_request messages.
          if (JSON.parse(s.eval('A ← 42')).error) process.exit(1);
          const persisted = JSON.parse(s.eval('A'));
          if (persisted.error || !String(persisted.value || '').includes('42')) {
            console.error('Persistent session failed:', persisted);
            process.exit(1);
          }

          // Completion regression: reuse BasedPL's native completion API.
          const completion = s.complete('⍳');
          if (!Array.isArray(completion)) {
            console.error('Completion API did not return an array:', completion);
            process.exit(1);
          }

          // Structured display regression: arrays must arrive through the
          // MIME/display event rather than being flattened by the adapter.
          const arrayResult = JSON.parse(s.eval('2 3⍴⍳6'));
          const arrayDisplay = (arrayResult.events || []).find(e => e.kind === 'display');
          if (!arrayDisplay?.data?.['text/plain']) {
            console.error('Missing structured array display:', arrayResult);
            process.exit(1);
          }
          NODE
      - name: Save BasedPL WASM cache
        if: steps.bpl-wasm-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: build/bpl
          key: basedpl-wasm-v1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup reproducible JupyterLite build environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-wasm-build.yml
          environment-name: basedpl-jupyterlite
          cache-downloads: true

      - name: Prepare BasedPL JupyterLite extension
        shell: bash -el {0}
        run: |
          cp build/bpl/basedpl_web.js jupyterlite/basedpl-kernel/src/basedpl_web.js
          cp build/bpl/basedpl_web_bg.wasm jupyterlite/basedpl-kernel/src/basedpl_web_bg.wasm

      - name: Build BasedPL JupyterLite extension
        working-directory: jupyterlite/basedpl-kernel
        shell: bash -el {0}
        run: |
          # GitHub Actions sets CI=true, which makes Yarn immutable by default.
          # This extension has no checked-in lockfile yet, so allow the initial
          # dependency resolution to create one in the build workspace.
          jlpm install --no-immutable
          jlpm build:lib
          jlpm build:labextension:dev

      - name: Install BasedPL JupyterLite extension
        shell: bash -el {0}
        run: |
          python -m pip install --no-build-isolation -e ./jupyterlite/basedpl-kernel

      - name: Build site
        shell: bash -el {0}
        run: python build.py

      - name: Build JupyterLite
        shell: bash -el {0}
        run: |
          rm -rf dist/jupyterlite
          cd jupyterlite
          jupyter lite build --output-dir ../dist/jupyterlite
          python - <<'PY'
          from pathlib import Path
          nav = '''<nav id="bpl-tabs" style="position:fixed;z-index:10000;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:5px;padding:0 12px;background:#fff;border-bottom:1px solid #d9d9de;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-sizing:border-box"><a href="../../" style="padding:6px 11px;border:1px solid #d9d9de;border-radius:8px;text-decoration:none;color:#333">Reference</a><a href="../../#repl" style="padding:6px 11px;border:1px solid #d9d9de;border-radius:8px;text-decoration:none;color:#333">REPL</a><a href="./?path=basedpl-display-tests.ipynb" style="padding:6px 11px;border:1px solid #0071e3;border-radius:8px;text-decoration:none;background:#0071e3;color:#fff">JupyterLite</a></nav><style>body{padding-top:44px!important}</style>'''
          p = Path('../dist/jupyterlite/lab/index.html')
          html = p.read_text(encoding='utf-8')
          if 'id="bpl-tabs"' not in html:
              html = html.replace('<body>', '<body>'+nav, 1)
              p.write_text(html, encoding='utf-8')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  e2e:
    name: Browser E2E against deployed Pages
    runs-on: ubuntu-latest
    needs: deploy
    env:
      BASE_URL: https://rahuketu86.github.io/basedpl_dynamicdocs/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed browser E2E
        run: node tests/e2e/repl.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
